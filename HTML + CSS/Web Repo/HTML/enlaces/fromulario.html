<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form>
        <input type="text" name="nombre" placeholder="pon tu nombre" required>
        <input type="color" name="color">
        <input type="date" name="fecha">
        <input type="email" name="email" placeholder="pon tu email" required>
        <input type="file" name="archivo">
        <input type="number" name="numero" value=0>
        <input type="password" name="contrasena" required>
        <input type="radio" name="opcion" value="opcion1"> Opción 1
        <input type="radio" name="opcion" value="opcion2"> Opción 2
        <input type="checkbox" name="aceptar" required> Acepto los términos y condiciones
        <input type="submit">
    </form>
</body>
</html>
